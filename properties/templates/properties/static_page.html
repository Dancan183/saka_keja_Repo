{% extends "properties/base.html" %}

{# Shared layout for About, Careers, FAQ, Terms and Privacy. Fill in page_title, page_intro and page_body. #}
{% block content %}
<style>
  .doc { max-width: 820px; margin: 0 auto; padding: 1rem 0 2rem; }
  .doc .crumbs { font-size: .9rem; color: #4b5563; margin-bottom: 1rem; }
  .doc h1 { font-size: clamp(1.8rem, 3.2vw, 2.4rem); line-height: 1.15; margin: 0 0 .5rem; color: var(--forest); }
  .doc .lead { font-size: 1.1rem; color: #374151; margin: 0 0 1.5rem; }
  .doc .updated { font-size: .88rem; color: #4b5563; margin: 0 0 1.5rem; }
  .doc h2 { font-size: 1.3rem; margin: 2rem 0 .5rem; color: var(--forest); }
  .doc h3 { font-size: 1.05rem; margin: 1.2rem 0 .3rem; }
  .doc p, .doc li { color: #1f2933; }
  .doc ul, .doc ol { padding-left: 1.3rem; }
  .doc li { margin-bottom: .35rem; }
  .doc .card { background: #f3faf6; border: 1px solid #cfe3d8; border-radius: 14px; padding: 1rem 1.2rem; margin: 1.2rem 0; }
  .doc .note { background: #fff8e1; border: 1px solid #f0d27a; border-radius: 12px; padding: .8rem 1rem; color: #5b4300; margin: 1.2rem 0; }
  .doc details { border: 1px solid #dfe9e3; border-radius: 12px; padding: .2rem 1rem; margin-bottom: .6rem; background: #fff; }
  .doc details[open] { background: #f6fbf8; border-color: #cfe3d8; }
  .doc summary { cursor: pointer; font-weight: 700; padding: .7rem 0; color: var(--dark); }
  .doc summary:focus-visible { outline: 3px solid rgba(27, 127, 75, .45); outline-offset: 2px; border-radius: 6px; }
  .doc details p { margin: 0 0 .8rem; }
  .doc .cta { margin-top: 1.5rem; }
  .doc table { border-collapse: collapse; width: 100%; margin: .6rem 0 1rem; font-size: .95rem; }
  .doc th, .doc td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  .doc th { background: #f3faf6; }
  @media (max-width: 600px) { .doc table, .doc thead, .doc tbody, .doc tr, .doc th, .doc td { display: block; } .doc thead { display: none; } .doc td { border: 0; padding: .15rem 0; } .doc tr { border-bottom: 1px solid #e5e7eb; padding: .5rem 0; } }
</style>

<article class="doc">
  <p class="crumbs"><a href="{% url 'properties:home' %}">Home</a> &rsaquo; {% block crumb %}{% endblock %}</p>
  {% block page_body %}{% endblock %}
</article>
{% endblock %}
