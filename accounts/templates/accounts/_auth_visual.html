{# Decorative side panel shared by login and register. Pass heading and text with {% include ... with %}. #}
<aside class="auth-visual" aria-hidden="true">
  <div class="auth-visual-text">
    <h2>{{ heading }}</h2>
    <p>{{ text }}</p>
    <ul class="auth-points">
      <li><i>&#10003;</i> Real photos and rents</li>
      <li><i>&#10003;</i> Message landlords directly</li>
      <li><i>&#10003;</i> Verified phone and email</li>
    </ul>
  </div>
  <svg class="auth-skyline" viewBox="0 0 600 200" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" focusable="false">
    <defs>
      <pattern id="win" width="14" height="16" patternUnits="userSpaceOnUse">
        <rect x="3" y="4" width="7" height="8" rx="1" fill="#b9f0d1" opacity=".55"/>
      </pattern>
    </defs>
    <rect x="20"  y="90"  width="70" height="110" fill="#164f37"/>
    <rect x="20"  y="90"  width="70" height="110" fill="url(#win)"/>
    <rect x="100" y="50"  width="80" height="150" fill="#1b6b45"/>
    <rect x="100" y="50"  width="80" height="150" fill="url(#win)"/>
    <rect x="190" y="110" width="60" height="90"  fill="#164f37"/>
    <rect x="190" y="110" width="60" height="90"  fill="url(#win)"/>
    <!-- house -->
    <polygon points="270,120 330,70 390,120" fill="#6fcf97"/>
    <rect x="280" y="120" width="100" height="80" fill="#e8f6ee"/>
    <rect x="318" y="150" width="24" height="50" fill="#1b7f4b"/>
    <rect x="290" y="132" width="20" height="20" fill="#1b7f4b" opacity=".7"/>
    <rect x="350" y="132" width="20" height="20" fill="#1b7f4b" opacity=".7"/>
    <rect x="400" y="80"  width="70" height="120" fill="#1b6b45"/>
    <rect x="400" y="80"  width="70" height="120" fill="url(#win)"/>
    <rect x="480" y="120" width="60" height="80"  fill="#164f37"/>
    <rect x="480" y="120" width="60" height="80"  fill="url(#win)"/>
    <rect x="550" y="70"  width="50" height="130" fill="#1b6b45"/>
    <rect x="550" y="70"  width="50" height="130" fill="url(#win)"/>
    <rect x="0" y="196" width="600" height="4" fill="#0b2e20"/>
  </svg>
</aside>
